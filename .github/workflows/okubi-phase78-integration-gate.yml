name: OKUBI Phase 78 - Integrated source and Cross Save gate

on:
  push:
    branches:
      - integration/okubi-phase78-release-candidate
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: okubi-phase78-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  non-destructive-integration-audit:
    name: Security, source, identity and license readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source without stored credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise offline phase 70, 72, unified and 78 audit tests
        run: |
          python -m unittest discover -s tools/tests -p 'test_okubi_phase70_release_gate.py' -v
          python -m unittest discover -s tools/tests -p 'test_okubi_phase72_release_audit.py' -v
          python -m unittest discover -s tools/tests -p 'test_okubi_unified_audit.py' -v
          python -m unittest discover -s tools/tests -p 'test_okubi_phase78_integration_gate.py' -v
      - name: Validate source without accessing personal data or signing keys
        run: python tools/okubi_phase78_integration_gate.py --root . --report build/phase78/integration-gate.json
      - name: Upload report only, never binaries or game saves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OKUBI-PHASE78-INTEGRATION-SOURCE-AUDIT
          path: build/phase78/integration-gate.json
          if-no-files-found: warn
          retention-days: 14

  portable-save-regression:
    name: Android-Windows synthetic save contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout source without stored credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile shared serializer and Windows source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build/phase78/classes | Out-Null
          $sources = @(Get-ChildItem -Recurse desktop/src -Filter '*.java' | ForEach-Object { $_.FullName })
          if ($sources.Count -lt 3) { throw 'Desktop sources are missing' }
          $archive = 'retro-module/java/bo/nexoplay/app/retro/OkubiSaveArchive.java'
          if (!(Test-Path $archive)) { throw 'Shared archive source missing' }
          & javac -encoding UTF-8 -d build/phase78/classes @sources $archive
          if ($LASTEXITCODE -ne 0) { throw 'Desktop and shared archive compilation failed' }
      - name: Run synthetic portable SRAM RTC and Windows cross-save tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = @(
            'desktop/tests/bo/okubi/desktop/DesktopCrossSaveTest.java',
            'retro-module/tests/java/bo/nexoplay/app/retro/OkubiSaveArchiveTest.java',
            'retro-module/tests/java/bo/nexoplay/app/retro/OkubiPortableSaveContractTest.java'
          )
          & javac -encoding UTF-8 -cp build/phase78/classes -d build/phase78/classes @tests
          if ($LASTEXITCODE -ne 0) { throw 'Cross-save tests failed to compile' }
          foreach ($test in @(
              'bo.nexoplay.app.retro.OkubiSaveArchiveTest',
              'bo.nexoplay.app.retro.OkubiPortableSaveContractTest',
              'bo.okubi.desktop.DesktopCrossSaveTest')) {
            & java -ea -cp build/phase78/classes $test
            if ($LASTEXITCODE -ne 0) { throw "Cross-save regression: $test" }
          }
      - name: Verify private data is absent from tracked source
        shell: pwsh
        run: |
          $tracked = @(git ls-files)
          $bad = @($tracked | Where-Object {
            $_ -match '(?i)\.(?:gba|gb|gbc|sfc|sav|srm|rtc|okubisave|jks|p12|pfx|keystore)$'
          })
          if ($bad.Count -gt 0) { throw 'Personal game save or signing file is tracked' }
          Write-Output 'PASS: only synthetic cross-save regression. No physical game data used.'
