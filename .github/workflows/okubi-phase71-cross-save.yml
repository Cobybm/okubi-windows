name: OKUBI Phase 71 - Android Windows Cross Save Matrix
on:
  push:
    branches: [test/okubi-phase71-cross-save-ci]
    paths:
      - 'desktop/src/**'
      - 'desktop/tests/**'
      - 'retro-module/java/**'
      - 'retro-module/tests/java/**'
      - '.github/workflows/okubi-phase71-cross-save.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-save-contract:
    name: Synthetic Cross Save - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout source (no write credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile shared Android serializer plus Windows implementation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build/phase71/classes | Out-Null
          $sources = @(Get-ChildItem -Recurse desktop/src -Filter '*.java' | ForEach-Object { $_.FullName })
          if ($sources.Count -lt 3) { throw 'Missing Windows sources' }
          $archive = 'retro-module/java/bo/nexoplay/app/retro/OkubiSaveArchive.java'
          if (!(Test-Path $archive)) { throw 'Missing common Android/Windows archive code' }
          & javac -encoding UTF-8 -d build/phase71/classes @sources $archive
          if ($LASTEXITCODE -ne 0) { throw 'Windows and Android shared source compile failed' }
      - name: Compile both platform contract regression suites together
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = @(
            'desktop/tests/bo/okubi/desktop/DesktopCrossSaveTest.java',
            'retro-module/tests/java/bo/nexoplay/app/retro/OkubiSaveArchiveTest.java',
            'retro-module/tests/java/bo/nexoplay/app/retro/OkubiPortableSaveContractTest.java'
          )
          & javac -encoding UTF-8 -cp build/phase71/classes -d build/phase71/classes @tests
          if ($LASTEXITCODE -ne 0) { throw 'Portable save tests did not compile' }
      - name: Test Android format, version and corrupted-file rejection
        shell: pwsh
        run: |
          & java -ea -cp build/phase71/classes bo.nexoplay.app.retro.OkubiSaveArchiveTest
          if ($LASTEXITCODE -ne 0) { throw 'Shared archive integrity checks failed' }
          & java -ea -cp build/phase71/classes bo.nexoplay.app.retro.OkubiPortableSaveContractTest
          if ($LASTEXITCODE -ne 0) { throw 'Android portable SRAM/RTC test failed' }
      - name: Test Windows import/export, recovery and no overwrite
        shell: pwsh
        run: |
          & java -ea -cp build/phase71/classes bo.okubi.desktop.DesktopCrossSaveTest
          if ($LASTEXITCODE -ne 0) { throw 'Windows Cross Save export/import test failed' }
      - name: Assert that tests never committed personal save files
        shell: pwsh
        run: |
          $tracked = @(git ls-files)
          $bad = @($tracked | Where-Object { $_ -match '(?i)\.(?:gba|gb|gbc|sfc|sav|srm|rtc|okubisave|jks|p12|pfx|keystore)$' })
          if ($bad.Count -gt 0) { throw 'Private save, ROM or signing file tracked' }
          Write-Output 'PASS: synthetic Cross Save works; physical Android-PC transfer is still pending'
